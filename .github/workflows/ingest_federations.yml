name: Ingest Federation Data

on:
  # Run monthly on the 1st at 05:00 UTC (federation rankings update monthly)
  schedule:
    - cron: "0 5 1 * *"
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated sources to run (pza,pzkol,pzm)"
        required: false
        default: "pza,pzkol,pzm"
      dry_run:
        description: "Dry run (fetch only, skip DB writes)"
        type: boolean
        required: false
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run federation ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          SOURCES="${{ github.event.inputs.sources || 'pza,pzkol,pzm' }}"
          DRY_RUN="${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}"
          python3 scripts/ingest_federations.py --sources "$SOURCES" $DRY_RUN
