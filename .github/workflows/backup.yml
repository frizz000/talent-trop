name: Database Backup

on:
  schedule:
    - cron: "0 3 * * 0"   # 03:00 UTC every Sunday
  workflow_dispatch:
    inputs:
      force_run:
        description: "Uruchom mimo wyłączenia pipeline'u w Admin panelu"
        type: boolean
        required: false
        default: false

jobs:
  backup:
    name: pg_dump → artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # workflow_id: backup (tabela workflow_settings, sterowane z /admin)
      - name: Check pipeline status
        id: check-pipeline-status
        env:
          PIPELINE_CHECK_SECRET: ${{ secrets.PIPELINE_CHECK_SECRET }}
        run: |
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            echo "force_run=true — pomijam sprawdzenie statusu, wymuszam uruchomienie"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RESPONSE=$(curl -sf --max-time 20 \
            -H "x-pipeline-check-key: $PIPELINE_CHECK_SECRET" \
            "https://talent-trop.vercel.app/api/pipeline-status?workflow=backup" || true)
          echo "pipeline-status: $RESPONSE"
          SHOULD_RUN=$(echo "$RESPONSE" | jq -r '.should_run' 2>/dev/null || echo "")
          if [ "$SHOULD_RUN" = "false" ]; then
            echo "::notice::Pipeline lub ten workflow jest wyłączony w Admin panelu — pomijam"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            # fail-open: brak/błędna odpowiedź endpointu nie blokuje crona
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check-pipeline-status.outputs.should_run == 'true'

      - name: Install postgresql-client
        if: steps.check-pipeline-status.outputs.should_run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Dump database
        if: steps.check-pipeline-status.outputs.should_run == 'true'
        run: |
          FILENAME="backup_$(date +%Y%m%d_%H%M%S).sql.gz"
          pg_dump "$SUPABASE_DB_URL" \
            --no-acl \
            --no-owner \
            --format=plain \
            | gzip > "$FILENAME"
          echo "BACKUP_FILE=$FILENAME" >> "$GITHUB_ENV"
          echo "Backup created: $FILENAME ($(du -sh "$FILENAME" | cut -f1))"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # SUPABASE_DB_URL format:
          # postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
          # Get it from: Supabase Dashboard → Project Settings → Database → Connection string

      - name: Upload backup artifact
        if: steps.check-pipeline-status.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}-${{ github.run_attempt }}
          path: backup_*.sql.gz
          retention-days: 30
          if-no-files-found: error
