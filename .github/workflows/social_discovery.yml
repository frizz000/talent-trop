name: Social Discovery & Brand Fit

on:
  schedule:
    - cron: "0 8 * * 1"   # Monday 08:00 UTC (weekly)
  workflow_dispatch:
    inputs:
      force_run:
        description: "Uruchom mimo wyłączenia pipeline'u w Admin panelu"
        type: boolean
        required: false
        default: false

jobs:
  social_discovery:
    name: Discover social profiles + compute brand fit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # workflow_id: social_discovery (tabela workflow_settings, sterowane z /admin)
      - name: Check pipeline status
        id: check-pipeline-status
        env:
          PIPELINE_CHECK_SECRET: ${{ secrets.PIPELINE_CHECK_SECRET }}
        run: |
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            echo "force_run=true — pomijam sprawdzenie statusu, wymuszam uruchomienie"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RESPONSE=$(curl -sf --max-time 20 \
            -H "x-pipeline-check-key: $PIPELINE_CHECK_SECRET" \
            "https://talent-trop-henna.vercel.app/api/pipeline-status?workflow=social_discovery" || true)
          echo "pipeline-status: $RESPONSE"
          SHOULD_RUN=$(echo "$RESPONSE" | jq -r '.should_run' 2>/dev/null || echo "")
          if [ "$SHOULD_RUN" = "false" ]; then
            echo "::notice::Pipeline lub ten workflow jest wyłączony w Admin panelu — pomijam"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            # fail-open: brak/błędna odpowiedź endpointu nie blokuje crona
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check-pipeline-status.outputs.should_run == 'true'

      - uses: actions/setup-python@v5
        if: steps.check-pipeline-status.outputs.should_run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        if: steps.check-pipeline-status.outputs.should_run == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Run social discovery
        if: steps.check-pipeline-status.outputs.should_run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python scripts/social_discovery.py
