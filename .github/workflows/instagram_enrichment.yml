name: Instagram Enrichment

on:
  schedule:
    - cron: "0 10 * * 1"   # Monday 10:00 UTC — after Social Discovery (08:00)
  workflow_dispatch:

jobs:
  instagram_enrichment:
    name: Enrich IG profiles via Apify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Enrich Instagram profiles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python scripts/enrich_instagram_profiles.py
